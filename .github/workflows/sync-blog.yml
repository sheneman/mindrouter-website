name: Sync blog

# Pulls the syndicated posts from the MindRouter gateway and regenerates the
# blog/ subtree. The gateway no longer pushes to this repo; this site owns its
# blog rendering and the feed is the source of truth.

on:
  # The hourly schedule is disabled: GitHub-hosted runners cannot reach the
  # feed. mindrouter.uidaho.edu is split-horizon — on campus it resolves to
  # 172.27.192.252 (RFC1918), and the public record (mindrouter-public.hpc.
  # uidaho.edu, 129.101.236.240) does not answer, so every scheduled run would
  # fail on connection timeout. Restore this block once the feed is reachable
  # from the public internet, or move the job to a self-hosted campus runner.
  # schedule:
  #   - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      allow_empty_feed:
        description: 'Allow an empty feed to delete every local post'
        type: boolean
        default: false
      dry_run:
        description: 'Report what would change without committing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned so rendering stays byte-identical between runs; a version bump
      # is a deliberate change that shows up as one re-render commit.
      - name: Install renderer
        run: pip install 'markdown==3.6' 'pygments==2.19.1'

      - name: Sync blog/ from the syndication feed
        run: |
          python tools/sync_blog.py --verbose \
            ${{ inputs.allow_empty_feed && '--allow-empty-feed' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push if the tree changed
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain -- blog)" ]; then
            echo "blog/ unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'mindrouter-blog-sync'
          git config user.email 'mindrouter-blog-sync@users.noreply.github.com'
          git add -A blog
          git commit -m 'blog: sync from MindRouter syndication feed'
          git push
          echo "### Blog updated" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
